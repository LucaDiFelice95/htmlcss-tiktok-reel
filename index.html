<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>TikTok Reel</title>
  </head>
  <body>
    <div class="container">
      <video src="assets/video/coder.mp4" class="video" loop autoplay></video>
      <!-- HEADER -->
      <header class="header">
        <i class="bi bi-play-btn"></i>
        <nav class="main__nav">
          <a href="#" class="main__nav-link">Esplora</a>
          <a href="#" class="main__nav-link">Seguiti</a>
          <a href="#" class="main__nav-link">Per te</a>
        </nav>
        <i class="bi bi-search"></i>
      </header>
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="sidebar__logo">
          <img src="assets/img/boolean_logo.png" alt="logo" />
        </div>
        <div class="sidebar__likes">
          <i class="bi bi-heart-fill"></i>
          <span>300</span>
        </div>
        <div class="sidebar__comments">
          <i class="bi bi-chat-dots-fill"></i>
          <span>22</span>
        </div>
        <div class="sidebar__bookmarks">
          <i class="bi bi-bookmark-fill"></i>
          <span>638</span>
        </div>
        <div class="sidebar__share">
          <i class="bi bi-share-fill"></i>
          <span>78</span>
        </div>
      </div>
      <!-- FOOTER -->
      <footer class="footer">
        <div class="footer__description">
          <h4>Boolean Careers</h4>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat,
            consequuntur!
            <span>mostra altro...</span>
          </p>
        </div>
        <div class="footer__nav">
          <div class="footer__nav-box">
            <i class="bi bi-house-fill white-btn"></i>
            <span>Home</span>
          </div>
          <div class="footer__nav-box">
            <i class="bi bi-people"></i>
            <span>Amici</span>
          </div>
          <div class="footer__nav-box">
            <div class="plus-btn">+</div>
            <span> </span>
          </div>
          <div class="footer__nav-box">
            <i class="bi bi-chat-left"></i>
            <span>Posta in arrivo</span>
          </div>
          <div class="footer__nav-box">
            <i class="bi bi-person"></i>
            <span>Profilo</span>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
